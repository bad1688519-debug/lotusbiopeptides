name: Validate second-site catalog
on:
  pull_request:
    branches: [main]
  push:
    branches: [design/global-b2b-store-positioning-20261112]
jobs:
  catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalog and JavaScript
        run: node tests/validate-site.mjs
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@24 playwright@1.56.1
      - name: Test cart and inquiry interactions
        run: node tests/cart-interaction.mjs
      - name: Install Chromium for browser testing
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile storefront
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          node tests/browser-smoke.mjs
